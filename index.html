<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>แบบสำรวจตัวเองในการตระหนักรู้ที่หลากหลายมิติมากขึ้น</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl overflow-hidden fade-in" id="app-container">

        <div class="bg-indigo-600 p-6 text-center text-white">
            <h1 class="text-xl md:text-2xl font-semibold leading-tight">แบบสำรวจตัวเองในการตระหนักรู้<br>ที่หลากหลายมิติมากขึ้น</h1>
            <p class="text-sm mt-2 opacity-90" id="progress-text">ค้นหาตัวตนของคุณ</p>
        </div>

        <div class="p-6 md:p-8" id="content-area">

            <!-- Intro -->
            <div id="intro-screen" class="fade-in">
                <div class="bg-indigo-50 border-l-4 border-indigo-500 p-4 mb-6 rounded-r-lg">
                    <p class="text-gray-800">
                        <strong>วิธีการ :</strong> เริ่มทำจากข้อ 1 อ่านคำในแต่ละคอลัมน์จากนั้นเลือกคำตอบข้อ ก. ข. ค. ง. ที่คุณคิดว่าเป็นตัวคุณมากที่สุด ทำจนครบ 10 ข้อ
                    </p>
                </div>
                <button onclick="startQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-8 rounded-full transition duration-300 w-full shadow-md text-lg">
                    เริ่มทำแบบสำรวจ
                </button>
            </div>

            <!-- Question -->
            <div id="question-screen" class="hidden fade-in">
                <h2 class="text-lg md:text-xl font-medium text-gray-800 mb-6 text-center bg-gray-100 py-3 px-4 rounded-lg leading-relaxed" id="question-title"></h2>
                <div id="options-container" class="space-y-3"></div>
                <div class="mt-6 flex justify-start">
                    <button id="back-btn" onclick="goBack()" class="hidden text-gray-500 hover:text-indigo-600 font-medium transition flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        ย้อนกลับไปข้อที่แล้ว
                    </button>
                </div>
            </div>

            <!-- Result -->
            <div id="result-screen" class="hidden fade-in">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4 shadow-sm">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">ผลลัพธ์ของคุณคือ</h2>
                    <h3 class="text-xl font-bold text-indigo-700" id="result-title"></h3>
                </div>

                <div class="bg-gray-50 p-5 rounded-xl border border-gray-100 mb-8 shadow-inner">
                    <!-- แก้: เอา text-justify indent-8 ออก ใช้ text-left + whitespace-pre-wrap -->
                    <p class="text-gray-700 leading-relaxed text-left whitespace-pre-wrap" id="result-desc"></p>
                </div>

                <div class="text-center">
                    <button onclick="location.reload()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-3 px-8 rounded-full transition duration-300 w-full md:w-auto">
                        ทำแบบสำรวจอีกครั้ง
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { id: 1, options: [{text: "ก) มุ่งที่ผลลัพธ์", type: "D"}, {text: "ข) สร้างสรรค์", type: "I"}, {text: "ค) ทำงานเป็นทีม", type: "S"}, {text: "ง) มุ่งที่รายละเอียด", type: "C"}] },
            { id: 2, options: [{text: "ก) ควบคุม", type: "D"}, {text: "ข) อิสระ", type: "I"}, {text: "ค) มั่นคง", type: "S"}, {text: "ง) เป็นระเบียบ", type: "C"}] },
            { id: 3, options: [{text: "ก) โกรธง่าย", type: "D"}, {text: "ข) มองโลกในแง่ดี", type: "I"}, {text: "ค) สุขุมมาก", type: "S"}, {text: "ง) มีสติ", type: "C"}] },
            { id: 4, options: [{text: "ก) พูดในสิ่งที่คิด", type: "D"}, {text: "ข) เล่าเรื่องเก่ง", type: "I"}, {text: "ค) ชอบคล้อยตาม", type: "S"}, {text: "ง) เน้นข้อมูล", type: "C"}] },
            { id: 5, options: [{text: "ก) ชอบแข่งขัน", type: "D"}, {text: "ข) ชอบปลีกวิเวก", type: "I"}, {text: "ค) ชอบให้กำลังใจ", type: "S"}, {text: "ง) ชอบความสมบูรณ์แบบ", type: "C"}] },
            { id: 6, options: [{text: "ก) พูดตรง ขวานผ่าซาก", type: "D"}, {text: "ข) คุยเก่ง น้ำท่วมทุ่ง", type: "I"}, {text: "ค) เป็นนักฟังที่ดี", type: "S"}, {text: "ง) เน้นพูดข้อเท็จจริง", type: "C"}] },
            { id: 7, options: [{text: "ก) ชอบกีฬาจริงจัง", type: "D"}, {text: "ข) ชอบงานสังสรรค์", type: "I"}, {text: "ค) ชอบอยู่เงียบ ๆ", type: "S"}, {text: "ง) ชอบหาข้อมูล", type: "C"}] },
            { id: 8, options: [{text: "ก) ชอบผลสรุป", type: "D"}, {text: "ข) ชอบความเป็นไปได้", type: "I"}, {text: "ค) เคร่งครัดในแบบแผน", type: "S"}, {text: "ง) ชอบตรรกะ", type: "C"}] },
            { id: 9, options: [{text: "ก) มอบหมายให้คนอื่นทำ", type: "D"}, {text: "ข) ชอบลองอะไรใหม่ ๆ", type: "I"}, {text: "ค) ทำตามผู้อื่น", type: "S"}, {text: "ง) ชอบค้นคว้า", type: "C"}] },
            { id: 10, options: [{text: "ก) เป็นผู้นำ", type: "D"}, {text: "ข) ดึงดูดใจ มีเสน่ห์", type: "I"}, {text: "ค) หลีกเลี่ยงความขัดแย้ง", type: "S"}, {text: "ง) ชอบตรวจสอบ", type: "C"}] }
        ];

        // เว้น 2 ช่องระหว่างวลี (แสดงผลได้เพราะใช้ whitespace-pre-wrap)
        const resultData = {
            "D": {
                title: "สไตล์ D : Dominance (คุณอำนาจ)",
                desc: "มีลักษณะที่เห็นได้ชัดเจน คือ ตรงไปตรงมา มั่นใจเด็ดขาด ตัดสินใจและจัดการงานเรื่องต่างๆได้อย่างรวดเร็ว  มีความคล่องตัวสูง และกล้าที่จะเผชิญหน้ากับผู้คน หรืออุปสรรคต่างๆ  พร้อมเปิดรับโอกาสและความท้าทายใหม่ๆที่จะเข้ามาอยู่เสมอ  แต่โดยนิสัยจะไม่ชอบใจนักหากถูกบังคับหรือถูกเอารัดเอาเปรียบ ถูกตีกรอบจนขาดอิสระในการคิดและทำงาน หรือผลงานที่รับผิดชอบไม่เป็นไปตามเป้าหมาย  และอาจจะรู้สึกแย่มากๆเมื่อต้องร่วมทีมทำงานกับคนที่เอาแต่พูด ไม่ลงมือทำ"
            },
            "I": {
                title: "สไตล์ I : Influence (คุณบันเทิง)",
                desc: "ผู้สร้างบรรยากาศเฮฮาสนุกสนาน  ชอบสไตล์การทำงานที่ไม่เป็นทางการ เป็นกันเอง  สร้างความสัมพันธ์กับผู้อื่นเสมอ ทักทายด้วยรอยยิ้ม  พูดเก่ง ช่างเจรจา  ชอบเข้าสังคมพบปะผู้คน  มีความเป็นตัวของตัวเองสูงพร้อมที่จะหยิบยื่นมิตรภาพที่ดีให้กับคนอื่นแม้จะไม่เคยรู้จักกันมาก่อน  ชอบดูแลคนรอบตัวอย่างมีส่วนร่วม  มีความสามารถในการโน้มน้าวจูงใจคนเก่ง ไอเดียดีและมีความคิดสร้างสรรค์  เป็นคนมองโลกในแง่ดี  แต่หากจำเป็นต้องอยู่ท่ามกลางผู้คนที่มองโลกในแง่ร้าย คนสไตล์นี้ก็จะรู้สึกไม่ค่อยชอบใจซักเท่าไหร่"
            },
            "S": {
                title: "สไตล์ S : Steadiness (คุณสุขุม)",
                desc: "เห็นได้ชัดเจนจากลักษณะเป็นคนใจเย็น สุขุม สุภาพ เป็นผู้ฟังที่ดี มีความอดทนสูง  พร้อมที่จะเข้าอกเข้าใจหรือเห็นใจผู้อื่นเสมอ  เป็นผู้สนับสนุนที่ดีและอยากช่วยเหลือผู้อื่นเสมอ  ให้เกียรติผู้คนรอบกาย  พร้อมที่จะเสียสละหรือทำงานเป็นผู้อยู่เบื้องหลังแบบปิดทองหลังพระ  มักหลีกเลี่ยงความขัดแย้ง เป็นนักไกล่เกลี่ยสร้างบรรยากาศความปรองดอง  ชอบทำงานตามแบบแผนค่อยเป็นค่อยไป  ขี้เกรงใจไม่กล้าปฏิเสธ  มักไม่ชอบสถานการณ์ที่ต้องตัดสินใจเร่งด่วน  ต้องออกหน้าหรือต้องแข่งขันกับใคร"
            },
            "C": {
                title: "สไตล์ C : Conscientious (คุณละเอียด)",
                desc: "เจ้าหลักการ ชอบการสังเกต เก็บข้อมูล  เน้นการนำข้อเท็จจริงมาเปรียบเทียบหาความถูกต้อง  หาแนวทางป้องกันความเสี่ยงและสร้างความมั่นคง  บุคลิกโดยรวมดูนิ่งเงียบจริงจังกับการทำงาน  สร้างผลงานด้วยความสมบูรณ์แบบ  สามารถคิดวิเคราะห์สิ่งต่างๆ ด้วยหลักการเหตุผลและมีวิธีการอย่างเป็นระบบ  เน้นทำงานด้วยความถูกต้องแม่นยำ  ไม่ถนัดนักหากต้องทำงานเร่งด่วนแบบไม่มีข้อมูลสนับสนุน หรือต้องประสานงานกับผู้คนหมู่มาก  หรือต้องอยู่ในสถานการณ์ที่ตนเองคาดการณ์ล่วงหน้าไม่ได้"
            }
        };

        let currentQuestion = 0;
        let userAnswers = new Array(questions.length).fill(null);

        function startQuiz() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('progress-text').innerText = `ข้อที่ ${currentQuestion + 1} จาก ${questions.length}`;
            document.getElementById('question-title').innerText = `เลือกคำตอบที่คุณคิดว่าเป็นตัวคุณมากที่สุด`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('fade-in');
            void optionsContainer.offsetWidth;
            optionsContainer.classList.add('fade-in');

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 border border-gray-200 rounded-xl hover:bg-indigo-50 hover:border-indigo-400 hover:shadow-sm transition-all duration-200 text-gray-700 bg-white text-lg";
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.type);
                optionsContainer.appendChild(btn);
            });

            const backBtn = document.getElementById('back-btn');
            backBtn.classList.toggle('hidden', currentQuestion === 0);
        }

        function selectOption(type) {
            userAnswers[currentQuestion] = type;
            currentQuestion++;
            if (currentQuestion < questions.length) showQuestion();
            else showResult();
        }

        function goBack() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion();
            }
        }

        function showResult() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('progress-text').innerText = "ประมวลผลเสร็จสิ้น";

            let finalScores = { "D": 0, "I": 0, "S": 0, "C": 0 };
            userAnswers.forEach(answer => { if (answer) finalScores[answer]++; });

            let highestType = "D";
            let maxScore = finalScores["D"];
            for (const type in finalScores) {
                if (finalScores[type] > maxScore) {
                    maxScore = finalScores[type];
                    highestType = type;
                }
            }

            document.getElementById('result-title').innerText = resultData[highestType].title;
            document.getElementById('result-desc').innerText = resultData[highestType].desc;
        }
    </script>
</body>
</html>
